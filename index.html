<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Janken</title>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="scoreboard">
        <h3>Scoreboard</h3>
        <p>User score: <span class="userScore"></span></p>
        <p>Computer score: <span class="computerScore"></span></p>
        <p>Total games: <span class="total-games"></span></p>
      </div>
      <div class="btn-container">
        <button class="rock">Rock</button>
        <button class="paper">Paper</button>
        <button class="scissors">Scissors</button>
      </div>
      <div class="display">
        <p>User move: <span class="user-move-container"></span></p>
        <p>Computer move: <span class="computer-move-container"></span></p>
        <p>Result: <span class="result-container"></span></p>
      </div>
    </main>
  </body>
</html>
